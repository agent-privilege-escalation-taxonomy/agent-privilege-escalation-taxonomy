[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-privilege-escalation-taxonomy"
version = "0.1.0"
description = "Agent Privilege Escalation Taxonomy: reproducible classification and measurement for tool-using agent privilege escalation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Parag Sawant" }]
keywords = ["ai-security", "agent-security", "zero-trust", "privilege-escalation", "taxonomy"]
classifiers = ["Programming Language :: Python :: 3.12", "Topic :: Security", "License :: OSI Approved :: Apache Software License"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "hypothesis>=6.112", "ruff>=0.8", "mypy>=1.13", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
agent-privilege-escalation-taxonomy = "agent_privilege_escalation_taxonomy.cli:main"

[project.urls]
Homepage = "https://github.com/agent-privilege-escalation-taxonomy/agent-privilege-escalation-taxonomy"
Issues = "https://github.com/agent-privilege-escalation-taxonomy/agent-privilege-escalation-taxonomy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_privilege_escalation_taxonomy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"bench/**" = ["S101", "S311", "S607", "T201"]
"scripts/**" = ["T201"]
"src/agent_privilege_escalation_taxonomy/taxonomy.py" = ["E501"]
"src/agent_privilege_escalation_taxonomy/classifier.py" = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["agent_privilege_escalation_taxonomy"]
omit = ["src/agent_privilege_escalation_taxonomy/cli.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__:", "raise NotImplementedError"]
